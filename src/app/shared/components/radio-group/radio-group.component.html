<div class="radio-group" [ngClass]="[orientation, variant]">
    <label *ngIf="label" class="form-label fw-semibold mb-2">
        {{ label }}
        <span *ngIf="required" class="text-danger">*</span>
    </label>

    <div class="radio-options d-flex flex-wrap" [ngClass]="{ 'flex-column': orientation === 'vertical' }">
        <div
                *ngFor="let opt of options; trackBy: trackByValue"
                class="radio-option"
                [class.selected]="value === opt.value"
                [class.disabled]="disabled"
                (click)="onSelect(opt.value)"
                role="radio"
                [attr.aria-checked]="value === opt.value"
                tabindex="0"
        >
            <div class="icon-container" *ngIf="opt.icon">
                <i [class]="opt.icon"></i>
            </div>
            <div class="label-text">{{ opt.label }}</div>
            <div class="radio-mark"></div>
        </div>
    </div>

    <small *ngIf="helpText && !errorMessage" class="text-muted">{{ helpText }}</small>
    <div *ngIf="errorMessage" class="invalid-feedback d-block mt-1">{{ errorMessage }}</div>
</div>
