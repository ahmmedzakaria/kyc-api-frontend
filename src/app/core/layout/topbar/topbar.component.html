<nav class="navbar bg-body shadow-sm px-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <button class="btn btn-link text-dark" (click)="layoutService.toggleSidebar()">
            <i class="fa fa-bars"></i>
        </button>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-link text-dark" (click)="toggleTheme()">
                <i [class]="theme === 'dark' ? 'fa fa-sun' : 'fa fa-moon'"></i>
            </button>

            <div class="dropdown">
                <button
                        class="btn btn-outline-secondary dropdown-toggle"
                        data-bs-toggle="dropdown"
                >
                    <i class="fa fa-user-circle"></i>
                    {{ user?.sub || 'Guest' }}
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" routerLink="/profile">Profile</a>
                    </li>
                    <li>
                        <a class="dropdown-item text-danger" (click)="logout.emit()">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
