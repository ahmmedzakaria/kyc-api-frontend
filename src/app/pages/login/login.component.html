<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="form" (ngSubmit)="login()">
    <div><label>Username</label><input formControlName="username" placeholder="Enter username" /></div>
    <div><label>Password</label><input type="password" formControlName="password" placeholder="Enter password" /></div>
    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    <button type="submit" [disabled]="form.invalid">Login</button>
  </form>
</div>
